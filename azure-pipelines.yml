# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self
  persistCredentials: true
  clean: true

- script: |
    git config --global user.email "rpms627@gmail.com"
    git config --global user.name "Rakesh Pawar"

    # Make sure we are on main
    git checkout main

    # Add Azure Repos as target remote
    git remote remove azure 2>/dev/null || true
    git remote add azure https://$(AZURE_DEVOPS_PAT)@dev.azure.com/MyDataMigrationOrg/Migration_SqlServer_to_ADLS/_git/Azure-Data-Enginering-Project

    # Push GitHub main to Azure Repos main
    git push azure main --force
  displayName: 'Mirror GitHub to Azure Repos'
